<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lettrix</title>
  <meta name="theme-color" content="#6aaa64" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Lettrix" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%236aaa64'/%3E%3Ctext x='256' y='340' font-family='Arial' font-size='280' font-weight='900' text-anchor='middle' fill='white'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%236aaa64'/%3E%3Ctext x='256' y='340' font-family='Arial' font-size='280' font-weight='900' text-anchor='middle' fill='white'%3EL%3C/text%3E%3C/svg%3E" />
  <script>
    const mn={name:"Lettrix",short_name:"Lettrix",description:"Wordle en français et en anglais",start_url:"/lettrix/",display:"standalone",background_color:"#121213",theme_color:"#6aaa64",icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%236aaa64'/%3E%3Ctext x='256' y='340' font-family='Arial' font-size='280' font-weight='900' text-anchor='middle' fill='white'%3EL%3C/text%3E%3C/svg%3E",sizes:"any",type:"image/svg+xml",purpose:"any maskable"}]};
    const bl=new Blob([JSON.stringify(mn)],{type:"application/json"});
    const lk=document.createElement("link");lk.rel="manifest";lk.href=URL.createObjectURL(bl);document.head.appendChild(lk);
  </script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Segoe UI',sans-serif;background:#121213;color:#fff;}
    @keyframes flip{
      0%  {transform:scaleY(1);background:#3a3a3c;border-color:#3a3a3c;}
      49% {transform:scaleY(0);background:#3a3a3c;border-color:#3a3a3c;}
      51% {transform:scaleY(0);background:var(--tc);border-color:var(--tc);}
      100%{transform:scaleY(1);background:var(--tc);border-color:var(--tc);}
    }
    @keyframes bounce{
      0%,100%{transform:translateY(0);}
      30%{transform:translateY(-26px);}
      55%{transform:translateY(-12px);}
      75%{transform:translateY(-18px);}
    }
    @keyframes shake{
      0%,100%{transform:translateX(0);}
      20%{transform:translateX(-8px);}
      40%{transform:translateX(8px);}
      60%{transform:translateX(-8px);}
      80%{transform:translateX(8px);}
    }
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(16px) scale(0.92);}
      to{opacity:1;transform:translateY(0) scale(1);}
    }
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel">
const {useState, useEffect, useCallback, useRef} = React;

const LANGS = {
  fr: {
    url: './mots.txt',
    cacheKey: 'lettrix_mots_fr',
    keyboard: [
      ["A","Z","E","R","T","Y","U","I","O","P"],
      ["Q","S","D","F","G","H","J","K","L","M"],
      ["ENTRÉE","W","X","C","V","B","N","⌫"]
    ],
    enter: 'ENTRÉE',
    t: {
      loading: 'Chargement…',
      noConn: 'Pas de connexion',
      noConnMsg: 'La liste de mots n\'est pas encore en cache. Connecte-toi une première fois pour jouer hors-ligne.',
      retry: 'Réessayer',
      bravo: 'Bravo !',
      found: n => `Trouvé en ${n} essai${n>1?'s':''}`,
      dommage: 'Dommage !',
      leMotEtait: 'Le mot était',
      rejouer: 'Rejouer',
      unknown: 'Mot inconnu !',
      fiveLetters: '5 lettres !',
    }
  },
  en: {
    url: 'https://raw.githubusercontent.com/tabatkins/wordle-list/main/words',
    cacheKey: 'lettrix_mots_en',
    keyboard: [
      ["Q","W","E","R","T","Y","U","I","O","P"],
      ["A","S","D","F","G","H","J","K","L"],
      ["ENTER","Z","X","C","V","B","N","M","⌫"]
    ],
    enter: 'ENTER',
    t: {
      loading: 'Loading…',
      noConn: 'No connection',
      noConnMsg: 'The word list is not cached yet. Connect once to play offline afterwards.',
      retry: 'Retry',
      bravo: 'Well done!',
      found: n => `Found in ${n} tr${n>1?'ies':'y'}`,
      dommage: 'Game over!',
      leMotEtait: 'The word was',
      rejouer: 'Play again',
      unknown: 'Unknown word!',
      fiveLetters: '5 letters!',
    }
  }
};

const TC  = {correct:"#538d4e", present:"#b59f3b", absent:"#3a3a3c"};
const KC  = {correct:"#538d4e", present:"#b59f3b", absent:"#565758"};
const PRI = {correct:3, present:2, absent:1};
const MAX = 6;

function calcColors(guess, mot) {
  const res=Array(5).fill("absent"), left=[...mot];
  for(let i=0;i<5;i++) if(guess[i]===mot[i]){res[i]="correct";left[i]=null;}
  for(let i=0;i<5;i++){
    if(res[i]==="correct") continue;
    const x=left.indexOf(guess[i]);
    if(x!==-1){res[i]="present";left[x]=null;}
  }
  return res;
}

function loadWords(lang) {
  return new Promise((resolve, reject) => {
    const cfg = LANGS[lang];
    try {
      const cached = localStorage.getItem(cfg.cacheKey);
      if(cached){ resolve(JSON.parse(cached)); return; }
    } catch(_){}
    fetch(cfg.url)
      .then(r => { if(!r.ok) throw new Error(r.status); return r.text(); })
      .then(txt => {
        const words = [...new Set(
          txt.split("\n")
            .map(w => w.trim().toUpperCase())
            .filter(w => w.length===5 && /^[A-Z]{5}$/.test(w))
        )];
        try { localStorage.setItem(cfg.cacheKey, JSON.stringify(words)); } catch(_){}
        resolve(words);
      })
      .catch(reject);
  });
}

function App() {
  const savedLang = localStorage.getItem('lettrix_lang') || 'fr';
  const [lang,      setLang]     = useState(savedLang);
  const [status,    setStatus]   = useState("loading");
  const [words,     setWords]    = useState(null); // Set
  const [secret,    setSecret]   = useState("");
  const [essais,    setEssais]   = useState([]);
  const [colors,    setColors]   = useState([]);
  const [actuel,    setActuel]   = useState("");
  const [keyStatus, setKeyStatus]= useState({});
  const [fini,      setFini]     = useState(false);
  const [gagne,     setGagne]    = useState(false);
  const [erreur,    setErreur]   = useState("");
  const [revRow,    setRevRow]   = useState(null);
  const [bounceRow, setBounceRow]= useState(null);
  const [shakeRow,  setShakeRow] = useState(null);
  const [modal,     setModal]    = useState(false);
  const tids = useRef([]);

  const initGame = useCallback((wordList) => {
    const arr = [...wordList];
    setWords(wordList);
    setSecret(arr[Math.floor(Math.random()*arr.length)]);
    setEssais([]); setColors([]); setActuel("");
    setKeyStatus({}); setFini(false); setGagne(false);
    setErreur(""); setRevRow(null); setBounceRow(null);
    setShakeRow(null); setModal(false);
    setStatus("ready");
  }, []);

  useEffect(() => {
    tids.current.forEach(clearTimeout); tids.current = [];
    setStatus("loading");
    loadWords(lang).then(arr => initGame(new Set(arr))).catch(() => setStatus("error"));
  }, [lang, initGame]);

  const switchLang = (l) => {
    if(l === lang) return;
    localStorage.setItem('lettrix_lang', l);
    setLang(l);
  };

  const cfg = LANGS[lang];
  const {t} = cfg;

  const err = useCallback((msg) => {
    setErreur(msg);
    setShakeRow(essais.length);
    const tid = setTimeout(()=>{setErreur("");setShakeRow(null);}, 600);
    tids.current.push(tid);
  }, [essais.length]);

  const soumettre = useCallback(() => {
    if(fini || revRow!==null || !words || !secret) return;
    if(actuel.length!==5){err(t.fiveLetters); return;}
    if(!words.has(actuel)){err(t.unknown); return;}

    const mot=actuel, rowIdx=essais.length;
    const cols=calcColors(mot, secret);
    setEssais(p=>[...p,mot]);
    setColors(p=>[...p,cols]);
    setActuel("");
    setRevRow(rowIdx);

    cols.forEach((c,i)=>{
      const tid=setTimeout(()=>{
        const l=mot[i];
        setKeyStatus(prev=>{
          if(!prev[l]||PRI[c]>PRI[prev[l]]) return{...prev,[l]:c};
          return prev;
        });
      }, i*300+250);
      tids.current.push(tid);
    });

    const tid=setTimeout(()=>{
      setRevRow(null);
      if(mot===secret){
        setGagne(true); setFini(true);
        setBounceRow(rowIdx);
        tids.current.push(setTimeout(()=>setModal(true), 700));
        tids.current.push(setTimeout(()=>setBounceRow(null), 1500));
      } else if(rowIdx+1>=MAX){
        setFini(true);
        tids.current.push(setTimeout(()=>setModal(true), 400));
      }
    }, 4*300+600);
    tids.current.push(tid);
  }, [actuel, essais, fini, revRow, words, secret, err, t]);

  const tap = useCallback((l) => {
    if(fini || revRow!==null) return;
    if(l==="⌫"){setActuel(a=>a.slice(0,-1)); return;}
    if(l===cfg.enter){soumettre(); return;}
    if(actuel.length<5) setActuel(a=>a+l);
  }, [fini, actuel, soumettre, revRow, cfg.enter]);

  useEffect(()=>{
    const h=e=>{
      const k=e.key.toUpperCase();
      if(k==="BACKSPACE") tap("⌫");
      else if(k==="ENTER") tap(cfg.enter);
      else if(/^[A-Z]$/.test(k)) tap(k);
    };
    window.addEventListener("keydown",h);
    return()=>window.removeEventListener("keydown",h);
  }, [tap, cfg.enter]);

  const rejouer = useCallback(() => {
    if(!words) return;
    tids.current.forEach(clearTimeout); tids.current = [];
    const arr=[...words];
    setSecret(arr[Math.floor(Math.random()*arr.length)]);
    setEssais([]); setColors([]); setActuel("");
    setKeyStatus({}); setFini(false); setGagne(false);
    setErreur(""); setRevRow(null); setBounceRow(null);
    setShakeRow(null); setModal(false);
  }, [words]);

  // Langue toggle
  const LangToggle = () => (
    <div style={{display:"flex",gap:4}}>
      {['fr','en'].map(l=>(
        <button key={l} onClick={()=>switchLang(l)} style={{
          padding:"4px 10px", borderRadius:6, border:"none", cursor:"pointer",
          fontWeight:700, fontSize:13,
          background: lang===l ? "#538d4e" : "#3a3a3c",
          color: "#fff", transition:"background 0.2s"
        }}>{l.toUpperCase()}</button>
      ))}
    </div>
  );

  if(status==="loading") return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#121213",color:"#fff",gap:16}}>
      <div style={{width:40,height:40,border:"4px solid #3a3a3c",borderTop:"4px solid #538d4e",borderRadius:"50%",animation:"spin 0.8s linear infinite"}} />
      <span style={{fontSize:16,color:"#aaa"}}>{t.loading}</span>
    </div>
  );

  if(status==="error") return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#121213",color:"#fff",gap:16,padding:24,textAlign:"center"}}>
      <LangToggle />
      <div style={{fontSize:48}}>📡</div>
      <div style={{fontSize:20,fontWeight:800}}>{t.noConn}</div>
      <div style={{color:"#aaa",fontSize:14,maxWidth:280}}>{t.noConnMsg}</div>
      <button onClick={()=>setLang(l=>l)} style={{marginTop:8,padding:"10px 24px",background:"#538d4e",color:"#fff",border:"none",borderRadius:8,fontSize:16,fontWeight:700,cursor:"pointer"}}>
        {t.retry}
      </button>
    </div>
  );

  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",minHeight:"100vh",paddingTop:20,background:"#121213",color:"#fff"}}>

      {/* Header */}
      <div style={{display:"flex",alignItems:"center",gap:16,borderBottom:"2px solid #3a3a3c",paddingBottom:10,marginBottom:16,width:"100%",justifyContent:"center",position:"relative"}}>
        <h1 style={{letterSpacing:6,fontSize:28,fontWeight:800}}>LETTRIX</h1>
        <div style={{position:"absolute",right:16}}><LangToggle /></div>
      </div>

      {erreur && <div style={{position:"fixed",top:72,left:"50%",transform:"translateX(-50%)",background:"#fff",color:"#121213",padding:"6px 14px",borderRadius:6,fontWeight:700,fontSize:14,zIndex:100,whiteSpace:"nowrap"}}>{erreur}</div>}

      {/* Grille */}
      <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:20}}>
        {Array.from({length:MAX}).map((_,i)=>{
          const essai=essais[i], cols=colors[i];
          const isInput  = i===essais.length && !fini && revRow===null;
          const isRev    = i===revRow;
          const isBounce = i===bounceRow;
          const isShake  = i===shakeRow;
          return (
            <div key={i} style={{display:"flex",gap:6,animation:isShake?"shake 0.5s ease":undefined}}>
              {Array.from({length:5}).map((_,j)=>{
                let lettre="", bg="#121213", border="2px solid #3a3a3c", anim=undefined, cssVar={};
                if(isRev){
                  lettre=essai[j];
                  anim=`flip 0.5s ease-in-out ${j*300}ms both`;
                  cssVar={"--tc":TC[cols[j]]};
                } else if(essai){
                  lettre=essai[j]; bg=TC[cols[j]]; border=`2px solid ${TC[cols[j]]}`;
                } else if(isInput){
                  lettre=actuel[j]||"";
                  border=lettre?"2px solid #999":"2px solid #3a3a3c";
                }
                return (
                  <div key={j} style={{animation:isBounce?`bounce 0.6s ease ${j*80}ms both`:undefined}}>
                    <div style={{
                      width:58,height:58,display:"flex",alignItems:"center",justifyContent:"center",
                      fontSize:26,fontWeight:800,color:"#fff",borderRadius:4,
                      ...(isRev?{}:{background:bg,border}),
                      animation:anim,...cssVar
                    }}>{lettre}</div>
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>

      {/* Clavier */}
      <div style={{display:"flex",flexDirection:"column",gap:6,width:"100%",padding:"10px 16px 24px"}}>
        {cfg.keyboard.map((row,i)=>(
          <div key={i} style={{display:"flex",gap:5,justifyContent:"center"}}>
            {row.map(l=>{
              const st=keyStatus[l];
              return (
                <button key={l} onClick={()=>tap(l)} style={{
                  flex:l.length>1?1.6:1, padding:"14px 0", minWidth:0,
                  background:st?KC[st]:"#818384", color:"#fff",
                  border:"none", borderRadius:4, fontWeight:700,
                  fontSize:l.length>1?11:16, cursor:"pointer",
                  transition:"background 0.3s"
                }}>{l}</button>
              );
            })}
          </div>
        ))}
      </div>

      {/* Modal */}
      {modal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div style={{background:"#1a1a1b",border:"1px solid #3a3a3c",borderRadius:18,padding:"36px 44px",textAlign:"center",width:"85%",maxWidth:300,animation:"fadeUp 0.4s ease"}}>
            {gagne?(
              <>
                <div style={{fontSize:52,marginBottom:8}}>🎉</div>
                <div style={{fontSize:24,fontWeight:800,marginBottom:6}}>{t.bravo}</div>
                <div style={{color:"#aaa",fontSize:15,marginBottom:20}}>{t.found(essais.length)}</div>
              </>
            ):(
              <>
                <div style={{fontSize:52,marginBottom:8}}>😢</div>
                <div style={{fontSize:24,fontWeight:800,marginBottom:6}}>{t.dommage}</div>
                <div style={{color:"#aaa",fontSize:14,marginBottom:6}}>{t.leMotEtait}</div>
                <div style={{fontSize:30,fontWeight:900,letterSpacing:5,color:"#538d4e",marginBottom:20}}>{secret}</div>
              </>
            )}
            <button onClick={rejouer} style={{padding:"12px 30px",background:"#538d4e",color:"#fff",border:"none",borderRadius:8,fontSize:17,fontWeight:700,cursor:"pointer"}}>
              {t.rejouer}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
